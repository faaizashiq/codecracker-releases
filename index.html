<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💖</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Floating hearts and flowers */
        .floating-item {
            position: fixed;
            font-size: 2rem;
            opacity: 0.6;
            pointer-events: none;
            z-index: 1;
        }

        .float-animation-1 {
            animation: float1 12s infinite ease-in-out;
        }

        .float-animation-2 {
            animation: float2 15s infinite ease-in-out;
        }

        .float-animation-3 {
            animation: float3 13s infinite ease-in-out;
        }

        .float-animation-4 {
            animation: float4 14s infinite ease-in-out;
        }

        @keyframes float1 {

            0%,
            100% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.6;
            }

            90% {
                opacity: 0.6;
            }

            100% {
                transform: translateY(-100px) translateX(20px) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes float2 {

            0%,
            100% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.6;
            }

            90% {
                opacity: 0.6;
            }

            100% {
                transform: translateY(-100px) translateX(-30px) rotate(-360deg);
                opacity: 0;
            }
        }

        @keyframes float3 {

            0%,
            100% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.6;
            }

            90% {
                opacity: 0.6;
            }

            100% {
                transform: translateY(-100px) translateX(15px) rotate(180deg);
                opacity: 0;
            }
        }

        @keyframes float4 {

            0%,
            100% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.6;
            }

            90% {
                opacity: 0.6;
            }

            100% {
                transform: translateY(-100px) translateX(-20px) rotate(-180deg);
                opacity: 0;
            }
        }

        .container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #d81b60;
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        p {
            color: #880e4f;
            font-size: 1.3rem;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            min-height: 150px;
            position: relative;
        }

        .btn {
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        #yesBtn {
            background: linear-gradient(135deg, #e91e63, #ff4081);
            padding: 12px 30px;
            font-size: 1rem;
            pointer-events: none;
            opacity: 0.6;
        }

        #yesBtn.enabled {
            pointer-events: auto;
            opacity: 1;
        }

        #noBtn {
            background: linear-gradient(135deg, #f8bbd0, #f48fb1);
            color: #880e4f;
            padding: 15px 35px;
            position: fixed;
            z-index: 1000;
        }

        .message {
            margin-top: 30px;
            font-size: 1.2rem;
            color: #d81b60;
            font-weight: bold;
            min-height: 30px;
        }

        /* Success Screen */
        #successContainer {
            display: none;
            text-align: center;
        }

        #successContainer.show {
            display: block;
        }

        .gif-container {
            width: 300px;
            height: 300px;
            margin: 0 auto 30px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #resetBtn {
            background: linear-gradient(135deg, #e91e63, #ff4081);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        #resetBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        /* Pulse animation */
        .pulse {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        /* Mobile responsive */
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            p {
                font-size: 1.1rem;
            }

            .gif-container {
                width: 250px;
                height: 250px;
            }
        }

        /* Hide element */
        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <!-- Floating Hearts and Flowers Background -->
    <div class="floating-item float-animation-1" style="left: 5%; animation-delay: 0s;">💖</div>
    <div class="floating-item float-animation-2" style="left: 15%; animation-delay: 2s;">🌹</div>
    <div class="floating-item float-animation-3" style="left: 25%; animation-delay: 4s;">💕</div>
    <div class="floating-item float-animation-1" style="left: 35%; animation-delay: 1s;">🌺</div>
    <div class="floating-item float-animation-4" style="left: 45%; animation-delay: 3s;">💝</div>
    <div class="floating-item float-animation-2" style="left: 55%; animation-delay: 5s;">🌸</div>
    <div class="floating-item float-animation-3" style="left: 65%; animation-delay: 2.5s;">💗</div>
    <div class="floating-item float-animation-1" style="left: 75%; animation-delay: 4.5s;">🌷</div>
    <div class="floating-item float-animation-4" style="left: 85%; animation-delay: 1.5s;">💓</div>
    <div class="floating-item float-animation-2" style="left: 95%; animation-delay: 3.5s;">🌼</div>

    <!-- Question Container -->
    <div class="container" id="questionContainer">
        <h1 id="questionText">Will you be my valentine? 🌹</h1>
        <p id="subText">Choose wisely... 😉</p>

        <div class="buttons">
            <button class="btn" id="noBtn">No</button>
            <button class="btn pulse" id="yesBtn">Yes! 💖</button>
        </div>

        <div class="message" id="messageBox"></div>
    </div>

    <!-- Success Container -->
    <div class="container" id="successContainer">
        <div class="gif-container">
            <img src="https://media.giphy.com/media/26u4cqiYI30juCOGY/giphy.gif" alt="Valentine Celebration">
        </div>
        <h1>Congratulations! 🎉</h1>
        <p style="font-size: 1.5rem; line-height: 1.6; margin-bottom: 10px;">You are finally now my Valentine! ❤️</p>
        <p style="font-size: 1.1rem; color: #c2185b; font-style: italic;">I knew you couldn't resist! 😊</p>
        <p style="font-size: 1rem; color: #880e4f; margin-top: 20px;">This is the beginning of something beautiful 💕
        </p>
        <button id="resetBtn">Try Again?</button>
    </div>

    <script>
        // DOM Elements
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const messageBox = document.getElementById('messageBox');
        const questionContainer = document.getElementById('questionContainer');
        const successContainer = document.getElementById('successContainer');
        const resetBtn = document.getElementById('resetBtn');
        const questionText = document.getElementById('questionText');
        const subText = document.getElementById('subText');

        // Audio Context for sound effects
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();


        // Better "No" click sound - soft pop
        function playNoSound() {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(600, audioContext.currentTime + 0.05);
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.05);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.05);
        }

        // Celebration sound
        function playCelebrationSound() {
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = freq;
                oscillator.type = 'sine';

                const startTime = audioContext.currentTime + (index * 0.15);
                gainNode.gain.setValueAtTime(0.15, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);

                oscillator.start(startTime);
                oscillator.stop(startTime + 0.3);
            });
        }

        // Questions (limited to 8)
        const questions = [
            { main: "Will you be my valentine? 🌹", sub: "Choose wisely... 😉" },
            { main: "Are you sure? 🤔", sub: "Think about it..." },
            { main: "Really? 😢", sub: "Please reconsider..." },
            { main: "Think again! 💭", sub: "We'd be perfect together!" },
            { main: "Last chance! ⚠️", sub: "Don't make me sad..." },
            { main: "Please? 🥺", sub: "Just say yes..." },
            { main: "Pretty please? 🙏", sub: "You know you want to..." },
            { main: "Final answer? 💔", sub: "This is your last 'No'..." }
        ];

        const funnyMessages = [
            "The 'No' button is running away! 😏",
            "You can't escape! 🏃",
            "Still trying? 🥰",
            "Getting harder, isn't it? �",
            "The 'Yes' is growing! �",
            "Almost there! 😎"
        ];

        // State
        let questionIndex = 0;
        let fontSize = 1;
        const maxFontSize = 4;
        const maxClicks = 8;

        // Initialize No button position
        function moveNoButton() {
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        // Initialize position
        moveNoButton();

        // No button click
        noBtn.addEventListener('click', () => {
            playNoSound();

            // Update question
            questionIndex++;
            if (questionIndex < questions.length) {
                questionText.textContent = questions[questionIndex].main;
                subText.textContent = questions[questionIndex].sub;
            }

            // Show funny message
            messageBox.textContent = funnyMessages[Math.min(questionIndex, funnyMessages.length - 1)];

            // Grow Yes button
            fontSize += 0.4;
            yesBtn.style.fontSize = `${fontSize}rem`;
            yesBtn.style.padding = `${12 + fontSize * 4}px ${30 + fontSize * 8}px`;

            // Move No button
            moveNoButton();

            // Hide No button and enable Yes button when max clicks reached
            if (fontSize >= maxFontSize || questionIndex >= maxClicks) {
                noBtn.classList.add('hidden');
                yesBtn.classList.add('enabled');
                messageBox.textContent = "Now you can click 'Yes'! 😉💖";
            }
        });

        // Yes button click
        yesBtn.addEventListener('click', () => {
            playCelebrationSound();

            // Confetti
            confetti({
                particleCount: 200,
                spread: 70,
                origin: { y: 0.6 }
            });

            // Show success screen
            questionContainer.style.display = 'none';
            successContainer.classList.add('show');
        });

        // Reset button
        resetBtn.addEventListener('click', () => {
            // Reset state
            questionIndex = 0;
            fontSize = 1;

            // Reset UI
            questionText.textContent = questions[0].main;
            subText.textContent = questions[0].sub;
            messageBox.textContent = '';
            yesBtn.style.fontSize = '1rem';
            yesBtn.style.padding = '12px 30px';
            yesBtn.classList.remove('enabled'); // Disable Yes button again
            noBtn.classList.remove('hidden');

            // Reset screens
            successContainer.classList.remove('show');
            questionContainer.style.display = 'block';

            // Reset No button position
            moveNoButton();
        });

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                yesBtn.click();
            }
        });
    </script>
</body>

</html>
